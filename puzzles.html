<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self' wss:; media-src 'self' blob: mediastream:; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3efe6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111814" media="(prefers-color-scheme: dark)">
  <title>Checkmate puzzles · Schness</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./assets/icon-180.png">
  <link rel="stylesheet" href="./styles.css?v=68">
</head>
<body class="puzzle-page">
  <main class="game">
    <header><a class="brand" href="./"><span class="brand-mark" aria-hidden="true">S</span><h1>Schness</h1></a><div class="header-actions"><button class="text-button theme-button" type="button" data-theme-toggle>Dark</button></div></header>
    <div class="puzzle-heading"><div><p class="eyebrow">Tactics</p><h2>Find the checkmate</h2></div><a class="text-button" href="./">← Home</a></div>
    <section class="puzzle-layout">
      <div class="puzzle-stage">
        <div class="replay-seat"><div id="puzzle-top-player" class="replay-player"></div><div class="reserve"><span id="puzzle-top-label" class="reserve-label"></span><div id="puzzle-top-reserve" class="bank"></div></div></div>
        <div id="puzzle-board" class="board" role="grid" aria-label="Checkmate puzzle board"></div>
        <div class="replay-seat"><div id="puzzle-bottom-player" class="replay-player"></div><div class="reserve"><span id="puzzle-bottom-label" class="reserve-label"></span><div id="puzzle-bottom-reserve" class="bank"></div></div></div>
      </div>
      <aside class="puzzle-panel">
        <details class="puzzle-settings" open>
          <summary>Puzzle mix</summary>
          <fieldset class="puzzle-levels"><legend>Include</legend><label><input type="checkbox" name="puzzle-level" value="1" checked><span>Mate 1</span></label><label><input type="checkbox" name="puzzle-level" value="2" checked><span>Mate 2</span></label><label><input type="checkbox" name="puzzle-level" value="3" checked><span>Mate 3</span></label><label><input type="checkbox" name="puzzle-level" value="4" checked><span>Mate 4</span></label></fieldset>
          <div class="puzzle-toggles"><label><input id="puzzle-hide-depth" type="checkbox"> Hide mate depth</label><label><input id="puzzle-auto-next" type="checkbox"> Auto-next when solved</label></div>
        </details>
        <p id="puzzle-progress" class="eyebrow"></p>
        <h3 id="puzzle-prompt">Loading verified puzzles…</h3>
        <div id="puzzle-feedback" class="puzzle-feedback" data-state="ready" role="status" aria-live="polite"><span id="puzzle-feedback-icon" aria-hidden="true">●</span><p id="puzzle-status">Find the forced checkmate.</p></div>
        <div class="puzzle-actions"><button id="puzzle-next" type="button">Next</button><button id="puzzle-reveal" type="button">Solution</button></div>
        <div id="puzzle-line" class="watch-moves" aria-label="Played line"></div>
        <details><summary>Source positions</summary><div id="puzzle-sources" class="replay-sources"></div></details>
      </aside>
    </section>
  </main>
  <script type="module" src="./src/puzzle-ui.js?v=68"></script>
</body>
</html>
