<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self' wss:; media-src 'self' blob: mediastream:; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3efe6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111814" media="(prefers-color-scheme: dark)">
  <title>Checkmate puzzles · Schness</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./assets/icon-180.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="puzzle-page">
  <main class="game">
    <header><a class="brand" href="./"><span class="brand-mark" aria-hidden="true">S</span><h1>Schness</h1></a><button class="text-button theme-button" type="button" data-theme-toggle>Dark</button></header>
    <div class="puzzle-heading"><div><p class="eyebrow">Tactics</p><h2>Find the checkmate</h2></div><a class="text-button" href="./">← Home</a></div>
    <section class="puzzle-layout">
      <div class="puzzle-stage">
        <div id="puzzle-opponent" class="replay-player"></div>
        <div id="puzzle-board" class="board" role="grid" aria-label="Checkmate puzzle board"></div>
        <div class="puzzle-you"><div id="puzzle-player" class="replay-player"></div><div id="puzzle-reserve" class="watch-reserve"></div></div>
      </div>
      <aside class="puzzle-panel">
        <label class="puzzle-level">Difficulty <select id="puzzle-level"><option value="all">All · random</option><option value="1">Mate in 1</option><option value="2">Mate in 2</option><option value="3">Mate in 3</option><option value="4">Mate in 4</option></select></label>
        <p id="puzzle-progress" class="eyebrow"></p>
        <h3 id="puzzle-prompt">Loading verified puzzles…</h3>
        <p id="puzzle-status" class="puzzle-status" aria-live="polite"></p>
        <div class="puzzle-actions"><button id="puzzle-next" type="button">Next puzzle</button><button id="puzzle-reveal" type="button">Show solution</button></div>
        <div id="puzzle-line" class="watch-moves" aria-label="Played line"></div>
        <details><summary>Source positions</summary><div id="puzzle-sources" class="replay-sources"></div></details>
      </aside>
    </section>
  </main>
  <script type="module" src="./src/puzzle-ui.js"></script>
</body>
</html>
