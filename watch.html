<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self' wss:; media-src 'self' blob: mediastream:; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3efe6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111814" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Schness">
  <title>Bot arena · Schness</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./assets/icon-180.png">
  <link rel="stylesheet" href="./styles.css?v=66">
</head>
<body class="watch-page">
  <main class="game">
    <header>
      <a class="brand" href="./" aria-label="Schness home"><span class="brand-mark" aria-hidden="true">S</span><h1>Schness</h1></a>
      <div class="header-actions"><button class="text-button theme-button" type="button" data-theme-toggle aria-label="Switch to dark mode">Dark</button></div>
    </header>
    <div class="watch-heading">
      <div><p class="eyebrow">Play · watch · experiment</p><h2>Bot arena</h2></div>
      <a class="text-button" href="./">← Home</a>
    </div>
    <section class="watch-layout" aria-label="Schness bot arena">
      <div class="watch-stage">
        <div class="watch-player"><label>Black <select id="black-level"><option value="human">You</option><option value="learning">Learning</option><option value="steady" selected>Steady</option><option value="sharp">Sharp</option></select></label><div id="black-reserve" class="bank" aria-label="Black reserve"></div></div>
        <div id="watch-board" class="board" role="grid" aria-label="Schness board"></div>
        <div class="watch-player"><label>White <select id="white-level"><option value="human" selected>You</option><option value="learning">Learning</option><option value="steady">Steady</option><option value="sharp">Sharp</option></select></label><div id="white-reserve" class="bank" aria-label="White reserve"></div></div>
      </div>
      <aside class="watch-panel">
        <p id="watch-status" class="watch-status" aria-live="polite">White to move</p>
        <div class="watch-controls">
          <button id="watch-previous" type="button">Previous</button>
          <button id="watch-next" type="button">Next</button>
          <button id="watch-auto" type="button" aria-pressed="false">Pause AIs</button>
          <button id="watch-live" type="button">Live position</button>
          <button id="watch-branch" type="button">Continue from here</button>
          <button id="watch-edit" type="button">Edit position</button>
          <button id="watch-restart" type="button">New game</button>
        </div>
        <div id="watch-moves" class="watch-moves" aria-label="Move transcript"></div>
      </aside>
    </section>
  </main>
  <dialog id="position-dialog" class="position-dialog" aria-labelledby="position-title">
    <div class="replay-head"><div><p class="eyebrow">Position editor</p><h2 id="position-title">Set the board</h2></div><button id="position-close" class="dialog-close" type="button" aria-label="Close editor">✕</button></div>
    <p class="position-help">Choose a piece, then a square. Each missing rook, bishop, or knight goes to its owner’s reserve.</p>
    <div class="position-tools" id="position-tools" aria-label="Pieces"><button type="button" data-piece="erase">Erase</button></div>
    <div id="position-board" class="board position-board" role="grid" aria-label="Position to edit"></div>
    <div class="position-foot"><label>Side to move <select id="position-turn"><option value="white">White</option><option value="black">Black</option></select></label><button id="position-clear" type="button">Clear board</button><button id="position-apply" type="button">Start here</button></div>
    <p id="position-error" class="position-error" aria-live="polite"></p>
  </dialog>
  <script type="module" src="./src/watch-ui.js?v=64"></script>
</body>
</html>
