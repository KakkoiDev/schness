name: Archive historical research\n# Deployment bridge refreshed for the bilingual interface.

on:
  pull_request:
    paths:
      - .github/workflows/archive-research.yml
  push:
    branches: [master]
    paths:
      - .github/workflows/archive-research.yml
  workflow_dispatch:
    inputs:
      run_id:
        description: Actions run containing the tournament artifact
        required: true
        type: string
      release_number:
        description: Tournament number used in the release tag and filename
        required: true
        type: string

permissions:
  actions: write
  contents: write

jobs:
  backfill:
    if: github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - release_number: '1'
            run_id: '34467850233'
          - release_number: '2'
            run_id: '34487140120'
    runs-on: ubuntu-latest
    steps:
      - name: Download historical tournament ${{ matrix.release_number }}
        uses: actions/download-artifact@v4
        with:
          pattern: schness-tournament-*
          path: archive
          merge-multiple: true
          run-id: ${{ matrix.run_id }}
          github-token: ${{ github.token }}
      - name: Package the research bundle
        run: (cd archive && zip -qr ../schness-tournament-${{ matrix.release_number }}.zip .)
      - name: Publish the permanent release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: tournament-run-${{ matrix.release_number }}
          ASSET: schness-tournament-${{ matrix.release_number }}.zip
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ASSET" --clobber
          else
            gh release create "$RELEASE_TAG" "$ASSET" --title "Tournament ${{ matrix.release_number }}" --notes "Permanent Schness tournament archive backfilled from Actions run ${{ matrix.run_id }}."
          fi

  archive:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download the historical tournament artifact
        uses: actions/download-artifact@v4
        with:
          pattern: schness-tournament-*
          path: archive
          merge-multiple: true
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Package the research bundle
        run: (cd archive && zip -qr ../schness-tournament-${{ inputs.release_number }}.zip .)
      - name: Publish the permanent release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: tournament-run-${{ inputs.release_number }}
          ASSET: schness-tournament-${{ inputs.release_number }}.zip
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ASSET" --clobber
          else
            gh release create "$RELEASE_TAG" "$ASSET" --title "Tournament ${{ inputs.release_number }}" --notes "Permanent Schness tournament archive backfilled from Actions run ${{ inputs.run_id }}."
          fi

  deploy-current-site:
    if: github.event_name != 'workflow_dispatch'
    needs: backfill
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Pages from master
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref master
