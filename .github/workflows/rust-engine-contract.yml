name: Rust engine conformance
on:
  push:
    paths: ['engine-rust/**', 'scripts/*engine*.js', 'src/**', 'test/fixtures/engine-contract/**', 'research/search-performance-v5/tactical-corpus.json', '.github/workflows/rust-engine-contract.yml']
  pull_request:
    paths: ['engine-rust/**', 'scripts/*engine*.js', 'src/**', 'test/fixtures/engine-contract/**', 'research/search-performance-v5/tactical-corpus.json', '.github/workflows/rust-engine-contract.yml']
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --manifest-path engine-rust/Cargo.toml
      - run: cargo build --release --locked --manifest-path engine-rust/Cargo.toml
      - run: npm run test:rust
