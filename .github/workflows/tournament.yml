name: AI tournament

on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: Complete 80-game sets (13 = 1,040 games)
        required: true
        default: '13'
        type: string
      seed:
        description: Reproducible base seed
        required: true
        default: '20260910'
        type: string

permissions:
  contents: write

jobs:
  tournament:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Play tournament outside the browser
        run: >-
          node scripts/run-tournament.js
          --repetitions ${{ inputs.repetitions }}
          --seed ${{ inputs.seed }}
          --workers 4
          --output tournament-shards
      - name: Build AI-readable bundle
        run: node scripts/aggregate-tournament.js tournament-shards tournament-results
      - name: Package durable release asset
        run: (cd tournament-results && zip -qr ../schness-tournament-${{ github.run_number }}.zip .)
      - name: Upload the single downloadable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: schness-tournament-${{ github.run_number }}
          path: tournament-results/
          retention-days: 30
          if-no-files-found: error
      - name: Publish permanent research release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: tournament-run-${{ github.run_number }}
          ASSET: schness-tournament-${{ github.run_number }}.zip
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ASSET" --clobber
          else
            gh release create "$RELEASE_TAG" "$ASSET" --title "Tournament ${{ github.run_number }}" --notes "Permanent Schness tournament archive. Source workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Seed: ${{ inputs.seed }}. Complete 80-game sets: ${{ inputs.repetitions }}."
          fi
