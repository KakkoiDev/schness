<!doctype html><title>Isolated engine benchmark</title><script src="/vendor/fairy-stockfish/stockfish.js"></script><script>
window.ready=(async()=>{const t=performance.now();window.sf=await Stockfish();window.startupMs=performance.now()-t;window.lines=[];sf.addMessageListener(x=>lines.push(x));window.command=async(cmd,end)=>{const start=lines.length;sf.postMessage(cmd);const until=performance.now()+30000;while(performance.now()<until){const got=lines.slice(start);if(got.some(x=>end.test(x)))return got;await new Promise(r=>setTimeout(r,1));}throw Error('UCI timeout '+cmd+' '+lines.slice(-5));};return command('uci',/^uciok/);})();
</script>
