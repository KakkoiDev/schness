<body class="lobby-page">
  <main class="game">
    <header>
      <a class="brand" href="./" aria-label="Schness home"><span class="brand-mark" aria-hidden="true">S</span><h1>Schness</h1></a>
      <div class="header-actions">
        <button class="text-button theme-button btn" type="button" data-theme-toggle aria-label="Switch to dark mode" data-variant="ghost">Dark</button>
        <button id="install" class="text-button btn" type="button" hidden data-variant="ghost">Install</button>
        <button class="text-button rules-button btn" type="button" data-open-rules data-variant="ghost">Rules</button>
      </div>
    </header>

    <section id="menu" class="menu" aria-labelledby="play-title">
      <div class="lobby-intro">
        <h2 id="play-title">Play Schness</h2>
        <p>Move a piece, or deploy one from your reserve. Every capture comes back.</p>
      </div>
      <div class="mode-buttons">
        <button id="bot-arena" class="mode dark btn" type="button" data-variant="outline"><strong>Bot arena</strong><small>Play, watch, take over, or edit a position</small></button>
        <button id="play-online" class="mode btn" type="button" data-variant="outline"><strong>Create an online game</strong><small>Get a link to send a friend</small></button>
        <button id="browse-games" class="mode btn" type="button" data-variant="outline"><strong>Browse recorded games</strong><small>Study 1,099 unique AI games</small></button>
        <button id="solve-puzzles" class="mode btn" type="button" data-variant="outline"><strong>Checkmate puzzles</strong><small>Mate in one, two, three, or four</small></button>
      </div>
    </section>

    <dialog id="online-setup" class="online-setup" aria-labelledby="online-setup-title">
      <form id="online-setup-form">
        <div class="replay-head"><div><p class="eyebrow">Online match</p><h2 id="online-setup-title">Choose a time control</h2></div><button id="online-setup-close" class="dialog-close btn" type="button" aria-label="Close online setup" data-variant="ghost">✕</button></div>
        <fieldset class="clock-choice">
          <legend>Time per player</legend>
          <div class="segmented">
            <label><input type="radio" name="clock" value="untimed" checked><span>Untimed</span></label>
            <label><input type="radio" name="clock" value="3+2"><span>3+2</span></label>
            <label><input type="radio" name="clock" value="5+0"><span>5+0</span></label>
            <label><input type="radio" name="clock" value="10+0"><span>10+0</span></label>
          </div>
        </fieldset>
        <p class="online-setup-note">Choose untimed or a clock before creating the invitation link.</p>
        <button class="card-primary online-setup-submit btn" type="submit" data-variant="primary">Create invitation link</button>
      </form>
    </dialog>





  </main>

<script type="module" src="./src/rules-modal.js?v=82"></script>
  <script type="module" src="./src/lobby.js?v=70"></script>
</body>
</html>
